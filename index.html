<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Applies the saved theme and language before first paint, so a returning
         light-mode or Arabic visitor never sees the dark/LTR page flash first.
         Keep the storage keys in step with ThemeProvider / LanguageProvider. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("mondo-theme");
          if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
          if (localStorage.getItem("mondo-lang") === "ar") {
            root.lang = "ar";
            root.dir = "rtl";
          }
        } catch (e) {}
      })();
    </script>

    <!-- The first catalogue query and every product image come from Supabase;
         Vite substitutes the project URL at build time. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Boutique en ligne, Paiement à la Livraison | Mondo Shope</title>
    <meta
      name="description"
      content="Mondo Shope — boutique en ligne en Algérie. Produits vérifiés en stock, paiement à la livraison, livraison à domicile ou au bureau dans toutes les wilayas."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.mondoshope.shop/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mondo Shope" />
    <meta property="og:title" content="Boutique en ligne, Paiement à la Livraison | Mondo Shope" />
    <meta
      property="og:description"
      content="Produits vérifiés en stock, paiement à la livraison, livraison à domicile ou au bureau dans toutes les wilayas."
    />
    <meta property="og:url" content="https://www.mondoshope.shop/" />
    <meta property="og:image" content="https://www.mondoshope.shop/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.mondoshope.shop/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mondo Shope" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boutique en ligne, Paiement à la Livraison | Mondo Shope" />
    <meta
      name="twitter:description"
      content="Produits vérifiés en stock, paiement à la livraison, livraison à domicile ou au bureau dans toutes les wilayas."
    />
    <meta name="twitter:image" content="https://www.mondoshope.shop/og-image.png" />

    <!-- Lets Google resolve a site search straight into /shop?q=… , which is a
         route that already exists (Shop.tsx reads the `q` param). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mondo Shope",
        "url": "https://www.mondoshope.shop/",
        "inLanguage": ["fr-DZ", "ar-DZ"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.mondoshope.shop/shop?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "@id": "https://www.mondoshope.shop/#store",
        "name": "Mondo Shope",
        "url": "https://www.mondoshope.shop/",
        "logo": "https://www.mondoshope.shop/logo.png",
        "image": "https://www.mondoshope.shop/og-image.png",
        "description": "Boutique en ligne en Algérie — paiement à la livraison dans toutes les wilayas.",
        "areaServed": "Algérie",
        "paymentAccepted": "Cash on delivery"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
